name: Refresh dashboard data

on:
  schedule:
    # Every weekday at 18:23 UTC (12:23 Mexico City). Banxico publishes the FIX
    # after 12:00 Mexico City time; the odd minute avoids GitHub's busy top of the hour.
    - cron: "23 18 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download data from Banxico and FRED
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python fetch_data.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit refreshed data and page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          git push
